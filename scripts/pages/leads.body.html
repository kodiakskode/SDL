<div class="pagehead">
  <div>
    <p class="eyebrow">Leads</p>
    <h1>Sydney landscape contacts</h1>
    <p class="lede" id="list-note">&nbsp;</p>
  </div>
  <div class="ctl-group">
    <span class="ctl-label">List</span>
    <select id="f-list" aria-label="Which lead list to show">
      <option value="architects">Landscape Architects</option>
      <option value="designers">Landscape Designers</option>
    </select>
    <button type="button" class="btn" id="import-list">Import CSV / Excel&hellip;</button>
    <button type="button" class="btn danger" id="delete-list" hidden>Delete this list</button>
    <input type="file" id="import-file" accept=".csv,.xlsx,.xls" hidden>
  </div>
</div>
<p class="eyebrow" id="import-note" style="min-height:1em"></p>

<div class="stats">
  <div class="stat"><div class="v" id="k-total">&mdash;</div><div class="k">In list</div></div>
  <div class="stat"><div class="v" id="k-email">&mdash;</div><div class="k">With email</div></div>
  <div class="stat"><div class="v" id="k-phone">&mdash;</div><div class="k">With phone</div></div>
  <div class="stat ink"><div class="v" id="k-shown">&mdash;</div><div class="k">Matching</div></div>
</div>

<div class="bar">
  <input type="search" id="q" placeholder="Search name, business, suburb or number&hellip;"
         aria-label="Search leads" style="min-width:220px;flex:1 1 240px">
  <select id="f-region" aria-label="Region"></select>
  <select id="f-contact" aria-label="Contact detail available">
    <option value="">Any contact detail</option>
    <option value="email">Has email</option>
    <option value="phone">Has phone</option>
    <option value="both">Has email + phone</option>
    <option value="web">Has website</option>
  </select>
  <select id="f-status" aria-label="Status"></select>
  <button type="button" class="btn" id="reset">Clear</button>
  <span class="tally" id="tally">&mdash;</span>
</div>

<div class="panel">
  <div class="panel-head">
    <span class="panel-title" id="sel-count">None ticked</span>
    <button type="button" class="btn primary" id="copy-email">Copy emails</button>
    <button type="button" class="btn" id="copy-phone">Copy phones</button>
    <button type="button" class="btn" id="copy-csv">Copy CSV</button>
    <button type="button" class="btn" id="clear-sel">Untick</button>
    <span class="panel-note" id="note"></span>
  </div>
  <div class="scroller" style="height:min(62vh,700px)">
    <table>
      <colgroup>
        <col style="width:38px"><col style="width:25%"><col style="width:18%">
        <col style="width:13%"><col style="width:23%"><col style="width:6%">
        <col style="width:13%">
      </colgroup>
      <thead><tr>
        <th class="pick"><input type="checkbox" id="check-all" aria-label="Tick every filtered row"></th>
        <th class="sortable" data-sort="org">Business / Name<span class="ind">&#9650;</span></th>
        <th class="sortable" data-sort="suburb">Location<span class="ind"></span></th>
        <th class="sortable" data-sort="phone">Phone<span class="ind"></span></th>
        <th class="sortable" data-sort="email">Email<span class="ind"></span></th>
        <th>Web</th>
        <th class="sortable" data-sort="status">Status<span class="ind"></span></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No contacts match these filters.</div>
  </div>
</div>

<p class="eyebrow" style="margin-top:var(--s2)">Tick rows to narrow it &mdash; with nothing ticked, copying takes every filtered row</p>

<script>window.SDL_OUTREACH_API_BASE = localStorage.getItem('sdl-outreach-api') || 'http://localhost:3021/rawleads/api';</script>
<script src="assets/js/xlsx.full.min.js"></script>
<script src="assets/leads.js?v=4"></script>
