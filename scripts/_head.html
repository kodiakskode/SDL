<link rel="stylesheet" href="assets/theme.css?v=4">
<script>
/* Resolve the theme before first paint so the page never flashes the wrong one. */
(function(){try{var m=localStorage.getItem("sdl-theme");
if(m!=="dark"&&m!=="light"){m=window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",m);}catch(e){}})();
</script>
</head>
